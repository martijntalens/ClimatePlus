name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-app:
    name: App configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint Home Assistant app
        uses: frenck/action-addon-linter@v2
        with:
          path: "./climateplus"

  code:
    name: Python & JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install aiohttp
        run: pip install aiohttp
      - name: Compile backend
        run: python -m py_compile climateplus/app/server.py
      - name: Import backend and test resampling
        run: |
          cd climateplus/app
          python - <<'EOF'
          import server
          pts = [(0, 10.0), (50, 20.0)]
          out = server.bucketize(pts, 0, 100, 2)
          assert out["v"] == [10.0, 20.0], out
          out = server.bucketize([(0, 10.0), (25, 20.0)], 0, 100, 1)
          assert out["v"] == [17.5], out
          assert server.is_relevant({"entity_id": "sensor.x", "attributes": {"device_class": "temperature"}}, set())
          assert not server.is_relevant({"entity_id": "sensor.y", "attributes": {"device_class": "power"}}, set())
          assert server.clean_entity_ids(["sensor.b", "sensor.a", "sensor.a"]) == ["sensor.a", "sensor.b"]
          for bad in ("sensor.a", ["../etc/passwd"], ["sensor.a", 5]):
              try:
                  server.clean_entity_ids(bad)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"accepted {bad!r}")
          import tempfile, pathlib
          server.SETTINGS_PATH = pathlib.Path(tempfile.mkdtemp()) / "settings.json"
          assert server.load_settings() == {"exclude_entities": []}
          server.save_settings({"exclude_entities": ["sensor.a"]})
          assert server.load_settings() == {"exclude_entities": ["sensor.a"]}
          # value changes of skipped (diagnostic) sensors must not reload dashboards
          async def _noop(_msg):
              pass
          ha = server.HomeAssistant({"exclude_entities": []}, {}, _noop)
          calls = []
          ha._schedule_reload = lambda **kw: calls.append(kw)
          diag = lambda v: {"entity_id": "sensor.plug_device_temperature", "state": v, "attributes": {"device_class": "temperature"}}
          ha.entity_registry = {"sensor.plug_device_temperature": {"entity_category": "diagnostic"}}
          ha.states = {"sensor.plug_device_temperature": diag("30")}
          ha._rebuild_relevant()
          assert ha.relevant == set()
          ha._on_state_changed({"data": {"entity_id": "sensor.plug_device_temperature", "old_state": diag("30"), "new_state": diag("31")}})
          assert calls == [], calls
          new = {"entity_id": "sensor.new_temp", "state": "20", "attributes": {"device_class": "temperature"}}
          ha._on_state_changed({"data": {"entity_id": "sensor.new_temp", "old_state": None, "new_state": new}})
          assert len(calls) == 1, calls
          print("ok")
          EOF
      - name: Check JavaScript syntax
        run: for f in climateplus/app/static/js/*.js; do node --check "$f"; done
      - name: Shellcheck run script
        run: shellcheck -s bash climateplus/run.sh || true
